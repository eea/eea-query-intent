[project]
name = "eea-query-intent"
version = "0.1.0"
description = "Benchmark and service tooling for multilingual EEA search-query intent routing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "European Environment Agency" }]
dependencies = []

[project.scripts]
eea-query-intent = "eea_query_intent.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
ml = [
    "numpy>=1.26,<2",
    "onnxruntime>=1.29.0",
    "setfit>=1.2.0",
]
service = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
# Single CWD root (uv run pytest --cov=.) plus explicit source so every
# report format (Cobertura, LCOV, HTML) carries fully-qualified paths like
# src/eea_query_intent/cli.py — bare per-root filenames would make the
# SonarQube python sensor unable to map coverage back to source files.
source = ["src/eea_query_intent"]
omit = [
  "tests/*",
  "scripts/*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Translation data files hold long, unsplit string literals.
"scripts/translations/*.py" = ["E501"]
# GPT translation scripts hold long, unsplit prompt/query string literals.
"scripts/gpt_translate_*.py" = ["E501"]
# GPT acceptance-corpus scripts hold long, unsplit prompt string literals.
"scripts/gpt_acceptance_*.py" = ["E501"]
"scripts/repair_acceptance_overlaps.py" = ["E501"]
# The temporary status dashboard embeds a full HTML/CSS/JS page as one literal.
"scripts/status_dashboard.py" = ["E501"]
